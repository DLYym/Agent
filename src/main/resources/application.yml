langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: sk-0c3c2a6da380490d938d5ee6e1069112
        model-name: qwen-turbo-latest
      streaming-chat-model:
        api-key: sk-0c3c2a6da380490d938d5ee6e1069112
