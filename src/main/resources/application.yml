app:
  rag:
    schema-top-k: 6
    schema-focus-top-k: 3
    vector-weight: 0.65
    keyword-weight: 0.35
  elasticsearch:
    enabled: false
    base-url: http://localhost:9200
    index-name: text2sql_schema
    allow-in-memory-fallback: true
  datasource-cache:
    max-size: 32
    expire-after-access: 30m
    max-pool-size: 10
    min-idle: 2
    idle-timeout: 120s
    connection-timeout: 30s
    validation-timeout: 5s
    leak-detection-threshold: 60000
  workflow:
    max-repair-attempts: 2
    auto-execute-generated-sql: true
    llm-stream-timeout: 2m
logging:
  level:
    com.yk.demoai: INFO

